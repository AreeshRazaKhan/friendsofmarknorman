<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>10 · Political Noise</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0B2844; --red:#B62025; --red-3:#D63D42;
    --paper:#F5F2EC; --paper-2:#EDE8DD; --bone:#D4CCB7; --stone:#5F594D; --stone-d:#3E3A33;
    --ff:'Cabin',sans-serif; --ff-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1a1a1a;display:grid;place-items:center;min-height:100vh;font-family:var(--ff)}
  .canvas{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--paper);color:var(--navy)}
  /* faint halftone */
  .canvas::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(11,40,68,.045) 1.2px,transparent 1.4px);background-size:14px 14px;z-index:1}
  /* radio static waveform SVG behind */
  .wave{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:280px;z-index:2;opacity:.30}
  .wave svg{width:100%;height:100%}
  /* big red rule top */
  .rule-t{position:absolute;left:60px;right:60px;top:100px;display:flex;align-items:center;gap:20px;z-index:3}
  .rule-t::before{content:"";flex:1;height:6px;background:var(--red)}
  .rule-t::after{content:"";flex:1;height:6px;background:var(--red)}
  .rule-t span{font-family:var(--ff-mono);font-size:20px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--red);flex-shrink:0}
  /* hero — fills nearly the whole canvas */
  .hero{position:absolute;left:60px;right:60px;top:200px;bottom:240px;display:flex;align-items:center;z-index:4}
  .hero h1{font-family:var(--ff);font-weight:700;font-size:172px;line-height:.86;letter-spacing:-.04em;color:var(--navy)}
  .hero h1 em{font-style:normal;font-weight:400;color:var(--red);display:inline-block;position:relative}
  .hero h1 em::after{content:"";position:absolute;left:-8px;right:-8px;bottom:16px;height:18px;background:rgba(182,32,37,.18);z-index:-1}
  /* bottom red rule */
  .rule-b{position:absolute;left:60px;right:60px;bottom:140px;height:6px;background:var(--red);z-index:3}
  /* PAC */
  .pac{position:absolute;left:60px;right:60px;bottom:62px;text-align:center;font-family:var(--ff-mono);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);z-index:5}
</style>
</head>
<body>
  <div class="canvas">
    <div class="wave">
      <svg viewBox="0 0 1080 280" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 0 140 Q 60 60 120 140 T 240 140 T 360 140 T 480 140 T 600 140 T 720 140 T 840 140 T 960 140 T 1080 140" stroke="#B62025" stroke-width="3" fill="none" opacity=".4"/>
        <path d="M 0 140 Q 30 100 60 140 T 120 140 T 180 140 T 240 140 T 300 140 T 360 140 T 420 140 T 480 140 T 540 140 T 600 140 T 660 140 T 720 140 T 780 140 T 840 140 T 900 140 T 960 140 T 1020 140 T 1080 140" stroke="#0B2844" stroke-width="2" fill="none" opacity=".5"/>
        <g stroke="#B62025" stroke-width="3" opacity=".5">
          <line x1="160" y1="40" x2="160" y2="240"/>
          <line x1="320" y1="80" x2="320" y2="200"/>
          <line x1="480" y1="20" x2="480" y2="260"/>
          <line x1="640" y1="100" x2="640" y2="180"/>
          <line x1="800" y1="50" x2="800" y2="230"/>
          <line x1="960" y1="90" x2="960" y2="190"/>
        </g>
      </svg>
    </div>
    <div class="hero">
      <h1>Oregon does not need more <em>political noise.</em></h1>
    </div>
    <div class="rule-b"></div>
    <div class="pac">Paid for by Friends of Mark Norman PAC #24927</div>
  </div>
</body>
</html>
