<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>07 · Priorities</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0B2844; --red:#B62025; --red-3:#D63D42;
    --paper:#F5F2EC; --paper-2:#EDE8DD; --bone:#D4CCB7; --stone:#5F594D; --stone-d:#3E3A33;
    --ff:'Cabin',sans-serif; --ff-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1a1a1a;display:grid;place-items:center;min-height:100vh;font-family:var(--ff)}
  .canvas{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--paper);color:var(--navy)}
  /* tilted hashtag stamp top */
  .hashtag{position:absolute;left:60px;top:80px;transform:rotate(-4deg);background:var(--navy);color:var(--paper);padding:18px 32px;box-shadow:10px 10px 0 var(--red);z-index:6}
  .hashtag p{font-family:var(--ff);font-weight:700;font-size:74px;letter-spacing:-.025em;line-height:.9}
  .hashtag p em{font-style:normal;font-weight:400;color:var(--red-3)}
  /* stars near hashtag */
  .star{position:absolute;color:var(--red);font-family:var(--ff);font-weight:700;z-index:5}
  .star.s1{top:80px;right:120px;font-size:34px}
  .star.s2{top:140px;right:230px;font-size:18px;opacity:.7}
  .star.s3{top:180px;right:90px;font-size:14px;opacity:.55}
  /* intro */
  .intro{position:absolute;left:60px;right:60px;top:290px;font-family:var(--ff);font-weight:700;font-size:54px;line-height:1.08;letter-spacing:-.02em;color:var(--stone-d);max-width:920px;z-index:4}
  .intro b{color:var(--navy)}
  /* three priority rows — like an album tracklist */
  .rows{position:absolute;left:60px;right:60px;top:460px;z-index:4;display:flex;flex-direction:column}
  .pri{display:flex;align-items:baseline;gap:30px;padding:26px 0;border-top:3px solid var(--navy);position:relative}
  .pri:last-child{border-bottom:3px solid var(--navy)}
  .pri .n{font-family:var(--ff);font-weight:700;font-size:120px;letter-spacing:-.04em;color:var(--red);line-height:1;width:140px;flex-shrink:0}
  .pri .t{font-family:var(--ff);font-weight:700;font-size:60px;letter-spacing:-.02em;color:var(--navy);line-height:1}
  .pri .t em{font-style:normal;font-weight:400;color:var(--red)}
  .pri .dot{position:absolute;right:0;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:var(--navy)}
  .pri:nth-child(2) .dot{background:var(--red)}
  /* PAC */
  .pac{position:absolute;left:60px;right:60px;bottom:36px;font-family:var(--ff-mono);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);text-align:center;z-index:5}

  /* ── 4:5 variant (1080×1350) ───────────────────────────── */
  .canvas.r45{height:1350px}
  .canvas.r45 .hashtag{top:110px}
  .canvas.r45 .intro{top:360px}
  .canvas.r45 .rows{top:560px}
  .canvas.r45 .pri{padding:36px 0}
  .canvas.r45 .pac{bottom:44px}

  /* ── 9:16 variant (1080×1920) ──────────────────────────── */
  .canvas.r916{height:1920px}
  .canvas.r916 .hashtag{top:160px}
  .canvas.r916 .star.s1{top:160px}
  .canvas.r916 .star.s2{top:230px}
  .canvas.r916 .star.s3{top:270px}
  .canvas.r916 .intro{top:500px}
  .canvas.r916 .rows{top:700px}
  .canvas.r916 .pri{padding:70px 0}
  .canvas.r916 .pac{bottom:60px}

  /* consistency: emphasis is color-only — no red highlight bar, and inline
     emphasis inherits its container weight so each text block is one weight */
  em::before,em::after{display:none!important}
  em,b,strong{font-weight:inherit!important}
</style>
</head>
<body>
  <div class="canvas">
    <span class="star s1">★</span>
    <span class="star s2">★</span>
    <span class="star s3">★</span>
    <div class="hashtag">
      <p>#<em>MarkForOregon</em></p>
    </div>
    <p class="intro"><b>Focused on three clear priorities:</b></p>
    <div class="rows">
      <div class="pri"><span class="n">01</span><span class="t">Making Oregon <em>more affordable</em></span><span class="dot"></span></div>
      <div class="pri"><span class="n">02</span><span class="t"><em>Strengthening</em> schools</span><span class="dot"></span></div>
      <div class="pri"><span class="n">03</span><span class="t">Bringing <em>accountability</em> to Salem</span><span class="dot"></span></div>
    </div>
    <div class="pac">Paid for by Friends of Mark Norman PAC #24927</div>
  </div>
  <script>
    const ratio = new URLSearchParams(location.search).get('ratio')
    if (ratio) document.querySelector('.canvas').classList.add('r' + ratio)
  </script>
<!-- post-scaler: fit canvas to viewport; ?v=45 / ?v=916 activate ratio variants -->
<style>
  html,body{height:100%;overflow:hidden}
  .canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1))}
</style>
<script>
(function(){
  var c=document.querySelector('.canvas')
  var v=new URLSearchParams(location.search).get('v')
  if(v==='45'||v==='916')c.classList.add('r'+v)
  var fit=function(){c.style.setProperty('--s',Math.min(innerWidth/c.offsetWidth,innerHeight/c.offsetHeight,1))}
  addEventListener('resize',fit)
  fit()
})()
</script>
</body>
</html>
