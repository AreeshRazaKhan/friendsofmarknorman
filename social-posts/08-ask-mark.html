<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>08 · Ask Mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0B2844; --red:#B62025; --red-3:#D63D42;
    --paper:#F5F2EC; --paper-2:#EDE8DD; --bone:#D4CCB7; --stone:#5F594D;
    --ff:'Cabin',sans-serif; --ff-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1a1a1a;display:grid;place-items:center;min-height:100vh;font-family:var(--ff)}
  .canvas{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--paper);color:var(--navy)}
  /* halftone paper */
  .canvas::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(11,40,68,.045) 1.4px,transparent 1.6px);background-size:14px 14px;z-index:1}
  /* big red ? as a watermark — peeking from behind portrait */
  .qbig{position:absolute;top:60px;right:-60px;font-family:var(--ff);font-weight:700;font-size:740px;line-height:.78;color:var(--red);z-index:2;letter-spacing:-.06em;opacity:.18}
  /* portrait */
  .portrait{position:absolute;top:120px;right:60px;width:380px;height:480px;z-index:4;border-radius:10px;overflow:hidden;border:6px solid var(--paper);box-shadow:14px 14px 0 var(--red)}
  .portrait img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
  /* speech-bubble corner */
  .bubble{position:absolute;top:80px;left:60px;width:88px;height:88px;background:var(--paper);border:5px solid var(--navy);border-radius:50% 50% 50% 8px;z-index:5;display:grid;place-items:center}
  .bubble::after{content:"";position:absolute;left:8px;bottom:-18px;width:30px;height:24px;background:var(--paper);border-right:5px solid var(--navy);border-bottom:5px solid var(--navy);clip-path:polygon(0 0,100% 0,100% 100%,80% 100%,0 0)}
  .bubble .dots{display:flex;gap:6px}
  .bubble .dots span{width:8px;height:8px;border-radius:50%;background:var(--navy)}
  /* hero — stacked on left */
  .hero{position:absolute;left:60px;top:220px;right:480px;z-index:5}
  .hero h1{font-family:var(--ff);font-weight:700;font-size:88px;line-height:.92;letter-spacing:-.03em;color:var(--navy)}
  .hero h1 em{font-style:normal;font-weight:400;color:var(--red);position:relative;display:inline-block}
  /* ask now button as sticker */
  .ask{position:absolute;left:60px;bottom:200px;transform:rotate(-4deg);background:var(--navy);color:var(--paper);padding:26px 50px;box-shadow:14px 14px 0 var(--red);z-index:6;border-radius:8px}
  .ask .t{font-family:var(--ff);font-weight:700;font-size:104px;letter-spacing:-.04em;line-height:.85}
  /* PAC */
  .pac{position:absolute;left:60px;right:60px;bottom:36px;font-family:var(--ff-mono);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);text-align:center;z-index:7}
</style>
</head>
<body>
  <div class="canvas">
    <div class="qbig">?</div>
    <div class="portrait">
      <img src="https://assets.cdn.filesafe.space/xpk2cvMlHO4xSLm4NgAz/media/6a10bb7fe0a73267018acbe4.png" alt="Mark Norman" />
    </div>
    <div class="bubble">
      <span class="dots"><span></span><span></span><span></span></span>
    </div>
    <div class="hero">
      <h1>Have a question for <em>Mark Norman?</em></h1>
    </div>
    <div class="ask">
      <div class="t">Ask Now!</div>
    </div>
    <div class="pac">Paid for by Friends of Mark Norman PAC #24927</div>
  </div>
</body>
</html>
