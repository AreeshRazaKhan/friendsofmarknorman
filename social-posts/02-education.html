<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>02 · Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0B2844; --red:#B62025; --red-3:#D63D42;
    --paper:#F5F2EC; --paper-2:#EDE8DD; --bone:#D4CCB7; --stone:#5F594D; --stone-d:#3E3A33;
    --ff:'Cabin',sans-serif; --ff-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1a1a1a;display:grid;place-items:center;min-height:100vh;font-family:var(--ff)}
  .canvas{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--paper);color:var(--navy)}
  /* ruled paper */
  .canvas::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(transparent 0 96px,rgba(11,40,68,.07) 96px 97px);z-index:1}
  /* red margin */
  .canvas::after{content:"";position:absolute;top:0;bottom:0;left:170px;width:2px;background:var(--red);z-index:2}
  /* hole-punch */
  .holes{position:absolute;left:78px;top:140px;bottom:140px;display:flex;flex-direction:column;justify-content:space-between;z-index:3}
  .holes span{display:block;width:32px;height:32px;border-radius:50%;background:#1a1a1a;border:6px solid var(--paper)}
  /* corner top-right pencil-stamp graphic */
  .pencil{position:absolute;top:50px;right:60px;width:260px;height:80px;z-index:4}
  .pencil svg{display:block;width:100%;height:100%;filter:drop-shadow(6px 6px 0 var(--red))}
  /* big A+ stamp tilted */
  .grade{position:absolute;top:520px;right:80px;transform:rotate(-8deg);width:150px;height:150px;border:6px solid var(--red);border-radius:50%;display:grid;place-items:center;z-index:5;background:rgba(245,242,236,.9)}
  .grade svg{width:92px;height:92px}
  /* hero head */
  .head{position:absolute;left:230px;right:80px;top:170px;z-index:4}
  .head h1{font-family:var(--ff);font-weight:700;font-size:128px;line-height:.85;letter-spacing:-.04em;color:var(--navy);max-width:780px}
  .head h1 em{font-style:normal;font-weight:400;color:var(--red);position:relative;display:inline-block}
  .head h1 em::after{content:"";position:absolute;left:-8px;right:-8px;bottom:14px;height:16px;background:rgba(182,32,37,.22);z-index:-1}
  /* editorial body */
  .body{position:absolute;left:230px;right:80px;top:680px;z-index:4;max-width:780px}
  .body p{font-family:var(--ff);font-weight:600;font-size:46px;line-height:1.18;letter-spacing:-.012em;color:var(--stone-d)}
  .body p b{font-weight:700;color:var(--navy)}
  .body p u{text-decoration:none;border-bottom:6px solid var(--red);padding-bottom:2px}
  /* corner red flag */
  .flag{position:absolute;top:0;left:0;width:170px;height:120px;background:var(--red);z-index:3;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
  /* PAC */
  .pac{position:absolute;left:230px;right:80px;bottom:36px;font-family:var(--ff-mono);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);z-index:5}
</style>
</head>
<body>
  <div class="canvas">
    <div class="flag"></div>
    <div class="holes"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="pencil">
      <svg viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- pencil body -->
        <rect x="0" y="24" width="180" height="32" fill="#F5F2EC" stroke="#0B2844" stroke-width="3"/>
        <rect x="0" y="24" width="180" height="32" fill="url(#stripe)" opacity=".2"/>
        <!-- pencil tip -->
        <polygon points="180,24 230,40 180,56" fill="#F5F2EC" stroke="#0B2844" stroke-width="3"/>
        <polygon points="210,33 230,40 210,47" fill="#0B2844"/>
        <!-- eraser -->
        <rect x="-12" y="20" width="20" height="40" fill="#B62025" stroke="#0B2844" stroke-width="3"/>
        <defs>
          <pattern id="stripe" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
            <rect width="2" height="8" fill="#0B2844"/>
          </pattern>
        </defs>
      </svg>
    </div>
    <div class="grade">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- big A+ as graphic, no text characters -->
        <path d="M 25,100 L 60,18 L 95,100 M 38,72 L 82,72" stroke="#B62025" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 12,40 L 22,40 M 17,35 L 17,45" stroke="#B62025" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="head">
      <h1>Mark Norman's<br/>education <em>focus.</em></h1>
    </div>
    <div class="body">
      <p>Students need <b>strong basics</b>, <u>real skills</u>, and <b>parents kept in the loop.</b></p>
    </div>
    <div class="pac">Paid for by Friends of Mark Norman PAC #24927</div>
  </div>
</body>
</html>
