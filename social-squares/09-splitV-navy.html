<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>09 · splitV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--navy:#0B2844;--navy-2:#102F4F;--navy-3:#0F3C66;--red:#B62025;--red-2:#921A1F;--red-3:#D63D42;--paper:#F5F2EC;--paper-2:#EDE8DD;--bone:#D4CCB7;--stone:#5F594D;--stone-d:#3E3A33;--paper-78:rgba(245,242,236,.82);--ff:'Cabin',sans-serif;--ff-mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:var(--ff)}
.logo{position:absolute;left:84px;top:84px;z-index:6}.logo-slot{display:inline-flex}
.eyebrow{display:flex;align-items:center;gap:16px;font-family:var(--ff-mono);font-size:21px;font-weight:600;letter-spacing:.26em;text-transform:uppercase}
.eyebrow::before{content:"";width:46px;height:4px;flex-shrink:0}
.headline{font-weight:700;letter-spacing:-.03em;line-height:.98}
.headline em{font-style:normal;font-weight:400;position:relative;display:inline-block}
.headline em::after{content:"";position:absolute;left:-6px;right:-6px;bottom:8px;height:15px;z-index:-1}
.stamp{position:absolute;z-index:4;background:var(--paper);border:5px solid var(--navy);border-radius:50%;display:grid;place-items:center;box-shadow:12px 12px 0 var(--red)}
.stamp svg{width:54%;height:54%}
.post{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--paper)}
.left{position:absolute;top:0;bottom:0;left:0;width:430px;background:var(--navy);color:var(--paper);padding:80px 50px;display:flex;flex-direction:column;justify-content:space-between}
.right{position:absolute;top:0;bottom:0;left:430px;right:0;color:var(--navy);padding:90px 70px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{color:var(--red-3)}.eyebrow::before{background:var(--red-3)}
.headline{color:var(--navy);font-size:74px}.headline em{color:var(--red)}.headline em::after{background:rgba(182,32,37,.20)}
.body{font-size:27px;line-height:1.5;color:var(--stone-d);margin-top:28px;max-width:520px}
</style></head>
<body>
  <div class="post" data-fonts="Cabin,JetBrains Mono">
    <div class="left"><div class="logo-slot"><img src="assets/mark-norman-logo-cabin-invert.png" alt="Mark Norman for Oregon" style="height:94px;width:auto;display:block"/></div><div aria-hidden="true" style="position:absolute;z-index:4;color:var(--paper);position:relative;width:190px;height:190px;margin-top:auto"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><path d="M50 14 C34 14 22 26 22 42 C22 64 50 88 50 88 C50 88 78 64 78 42 C78 26 66 14 50 14 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><circle cx="50" cy="42" r="11" fill="#B62025"/></svg></div><span class="eyebrow t" style="margin-top:40px">[ local issues ]</span></div>
    <div class="right"><h1 class="headline t">Oregon problems need <em>Oregon solutions</em></h1><p class="body t">People do not need to agree on every national issue to work together on local problems.</p></div>
  </div>
<style>html,body{height:100%;overflow:hidden}.post{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1))}</style>
<script>(function(){var c=document.querySelector('.post');if(!c)return;var f=function(){c.style.setProperty('--s',Math.min(innerWidth/c.offsetWidth,innerHeight/c.offsetHeight,1))};addEventListener('resize',f);f()})()</script>
</body></html>
