<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>47 · bannerStripe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--navy:#0B2844;--navy-2:#102F4F;--navy-3:#0F3C66;--red:#B62025;--red-2:#921A1F;--red-3:#D63D42;--paper:#F5F2EC;--paper-2:#EDE8DD;--bone:#D4CCB7;--stone:#5F594D;--stone-d:#3E3A33;--paper-78:rgba(245,242,236,.82);--ff:'Cabin',sans-serif;--ff-mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:var(--ff)}
.logo{position:absolute;left:84px;top:84px;z-index:6}.logo-slot{display:inline-flex}
.eyebrow{display:flex;align-items:center;gap:16px;font-family:var(--ff-mono);font-size:21px;font-weight:600;letter-spacing:.26em;text-transform:uppercase}
.eyebrow::before{content:"";width:46px;height:4px;flex-shrink:0}
.headline{font-weight:700;letter-spacing:-.03em;line-height:.98}
.headline em{font-style:normal;font-weight:400;position:relative;display:inline-block}
.headline em::after{content:"";position:absolute;left:-6px;right:-6px;bottom:8px;height:15px;z-index:-1}
.stamp{position:absolute;z-index:4;background:var(--paper);border:5px solid var(--navy);border-radius:50%;display:grid;place-items:center;box-shadow:12px 12px 0 var(--red)}
.stamp svg{width:54%;height:54%}
.post{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--navy);color:var(--paper)}
.eyebrow{color:var(--red-3)}.eyebrow::before{background:var(--red-3)}
.headline{color:var(--paper)}.headline em{color:var(--red-3)}.headline em::after{background:rgba(214,61,66,.24)}
.body{font-size:28px;line-height:1.5;color:var(--paper-78)}
.post{display:flex;flex-direction:column;justify-content:center;padding:90px}
.content{position:relative;z-index:3;background:var(--navy);padding:50px 56px;max-width:880px}
.rt{display:flex;align-items:center;gap:20px;margin-bottom:12px}.rt::after{content:"";flex:1;height:5px;background:var(--red-3)}
.eyebrow{display:inline-flex}.eyebrow::before{display:none}
.headline{font-size:118px;line-height:.92;text-transform:uppercase;margin-top:8px;word-break:break-word}
/* emphasis is red color only — no highlight bar under/after the word */
.headline em::after,.title em::after,.quote em::after{display:none}
</style></head>
<body>
  <div class="post" data-fonts="Cabin,JetBrains Mono">
    <span aria-hidden="true" style="position:absolute;inset:0;z-index:0;background-image:repeating-linear-gradient(45deg,rgba(182,32,37,.18) 0 2px,transparent 2px 26px)"></span>
    <div class="logo"><div class="logo-slot"><img src="assets/mark-norman-logo-cabin-invert.png" alt="Mark Norman for Oregon — House District 27" style="height:100px;width:auto;display:block" /></div></div>
    <div class="content"><div class="rt"><span class="eyebrow t">[ oregon families ]</span></div><h1 class="headline t">Oregon families are <em>paying the price</em></h1></div>
  </div>
<style>html,body{height:100%;overflow:hidden}.post{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1))}</style>
<script>(function(){var c=document.querySelector('.post');if(!c)return;var f=function(){c.style.setProperty('--s',Math.min(innerWidth/c.offsetWidth,innerHeight/c.offsetHeight,1))};addEventListener('resize',f);f()})()</script>
</body></html>
