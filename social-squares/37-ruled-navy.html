<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>37 · ruled</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--navy:#0B2844;--navy-2:#102F4F;--navy-3:#0F3C66;--red:#B62025;--red-2:#921A1F;--red-3:#D63D42;--paper:#F5F2EC;--paper-2:#EDE8DD;--bone:#D4CCB7;--stone:#5F594D;--stone-d:#3E3A33;--paper-78:rgba(245,242,236,.82);--ff:'Cabin',sans-serif;--ff-mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:var(--ff)}
.logo{position:absolute;left:84px;top:84px;z-index:6}.logo-slot{display:inline-flex}
.eyebrow{display:flex;align-items:center;gap:16px;font-family:var(--ff-mono);font-size:21px;font-weight:600;letter-spacing:.26em;text-transform:uppercase}
.eyebrow::before{content:"";width:46px;height:4px;flex-shrink:0}
.headline{font-weight:700;letter-spacing:-.03em;line-height:.98}
.headline em{font-style:normal;font-weight:inherit;position:relative;display:inline-block}
.headline em::after{content:"";position:absolute;left:-6px;right:-6px;bottom:8px;height:15px;z-index:-1}
.stamp{position:absolute;z-index:4;background:var(--paper);border:5px solid var(--navy);border-radius:50%;display:grid;place-items:center;box-shadow:12px 12px 0 var(--red)}
.stamp svg{width:54%;height:54%}
.post{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--navy);color:var(--paper)}
.eyebrow{color:var(--red-3)}.eyebrow::before{background:var(--red-3)}
.headline{color:var(--paper)}.headline em{color:var(--red-3)}.headline em::after{background:rgba(214,61,66,.24)}
.body{font-size:28px;line-height:1.5;color:var(--paper-78)}
.post{display:flex;flex-direction:column;justify-content:center;padding:90px 90px 90px 210px}
.content{position:relative;z-index:3;max-width:600px}
.headline{font-size:84px;margin-top:22px}.body{margin-top:28px;max-width:560px}
.flag{position:absolute;top:0;left:0;width:150px;height:110px;background:var(--red);z-index:2;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
/* emphasis is red color only — no highlight bar under/after the word */
.headline em::after,.title em::after,.quote em::after{display:none}
</style></head>
<body>
  <div class="post" data-fonts="Cabin,JetBrains Mono">
    <span aria-hidden="true" style="position:absolute;inset:0;z-index:0;background-image:repeating-linear-gradient(transparent 0 95px,rgba(245,242,236,.08) 95px 96px)"></span><span aria-hidden="true" style="position:absolute;top:0;bottom:0;left:150px;width:2px;background:var(--red);z-index:0"></span><span class="flag" aria-hidden="true"></span><span aria-hidden="true" style="position:absolute;z-index:0;font-weight:700;line-height:.7;letter-spacing:-.05em;color:var(--paper);opacity:.05;right:-20px;bottom:-150px;font-size:560px">37</span>
    <div class="logo"><div class="logo-slot"><img src="assets/mark-norman-logo-cabin-invert.png" alt="Mark Norman for Oregon — House District 27" style="height:104px;width:auto;display:block" /></div></div>
    <div aria-hidden="true" style="position:absolute;z-index:4;color:var(--paper);border:4px solid var(--red);border-radius:10px;display:grid;place-items:center;transform:rotate(-8deg);right:96px;top:150px;width:180px;height:180px"><div style="width:60%;height:60%"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><line x1="30" y1="16" x2="30" y2="86" stroke="currentColor" stroke-width="6"/><path d="M30 20 H72 L62 34 L72 48 H30 Z" fill="#B62025" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg></div></div>
    <div class="content"><span class="eyebrow t">[ reject socialism ]</span><h1 class="headline t">Reject the <em>socialist agenda</em></h1><p class="body t">House District 27 does not need higher taxes, expanded bureaucracy, public ownership, and centralized control.</p></div>
  </div>
<style>html,body{height:100%;overflow:hidden}.post{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1))}</style>
<script>(function(){var c=document.querySelector('.post');if(!c)return;var f=function(){c.style.setProperty('--s',Math.min(innerWidth/c.offsetWidth,innerHeight/c.offsetHeight,1))};addEventListener('resize',f);f()})()</script>
</body></html>
