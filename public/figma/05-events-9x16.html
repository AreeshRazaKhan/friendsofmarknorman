<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8" />
<title>05 · Events</title>



<style>
  :root{
    --navy:#0B2844; --red:#B62025; --red-3:#D63D42;
    --paper:#F5F2EC; --paper-2:#EDE8DD; --bone:#D4CCB7; --stone:#5F594D;
    --ff:'Cabin',sans-serif; --ff-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1a1a1a;display:grid;place-items:center;min-height:100vh;font-family:var(--ff)}
  .canvas{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--navy);color:var(--paper)}
  /* halftone */
  .canvas::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(245,242,236,.07) 1.4px,transparent 1.6px);background-size:14px 14px;z-index:1}
  /* big red diagonal wedge */
  .wedge{position:absolute;inset:0;background:var(--red);clip-path:polygon(0 70%, 100% 30%, 100% 100%, 0 100%);z-index:2}
  .wedge::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 22px)}
  /* star constellation in upper-left only (right side is reserved for portrait) */
  .star{position:absolute;color:var(--paper);z-index:3;font-family:var(--ff);font-weight:700}
  .star.s1{top:90px;left:80px;font-size:36px;color:var(--red-3)}
  .star.s2{top:200px;left:180px;font-size:20px;opacity:.7}
  .star.s3{top:140px;left:280px;font-size:14px;opacity:.55}
  /* portrait */
  .portrait{position:absolute;top:120px;right:60px;width:380px;height:480px;z-index:4;border-radius:10px;overflow:hidden;border:6px solid var(--paper);box-shadow:14px 14px 0 var(--red)}
  .portrait img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
  /* hero question — left column */
  .hero{position:absolute;left:60px;top:160px;right:480px;z-index:5}
  .hero h1{font-family:var(--ff);font-weight:700;font-size:88px;line-height:.9;letter-spacing:-.03em;color:var(--paper)}
  .hero h1 em{font-style:normal;font-weight:400;color:var(--red-3);display:inline-block}
  /* sub line */
  .sub{position:absolute;left:60px;top:430px;right:480px;font-family:var(--ff);font-weight:500;font-size:26px;line-height:1.3;color:rgba(245,242,236,.95);z-index:5}
  /* event ticket aesthetic at bottom on the red */
  .ticket{position:absolute;left:60px;right:60px;bottom:130px;background:var(--paper);color:var(--navy);padding:24px 28px;display:flex;justify-content:space-between;align-items:center;gap:24px;z-index:6;box-shadow:14px 14px 0 var(--navy);border-radius:6px;overflow:hidden}
  .ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(var(--paper) 0 8px, var(--navy) 8px 14px)}
  .ticket .left{display:flex;flex-direction:column;gap:6px;padding-left:14px}
  .ticket .lbl{font-family:var(--ff-mono);font-size:18px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--red)}
  .ticket .u{font-family:var(--ff);font-weight:700;font-size:34px;letter-spacing:-.02em;line-height:1;color:var(--navy);word-break:break-all}
  .ticket .arr{width:80px;height:80px;border-radius:50%;background:var(--navy);color:var(--paper);display:grid;place-items:center;font-family:var(--ff);font-weight:700;font-size:36px;flex-shrink:0;line-height:1}
  /* PAC */
  .pac{position:absolute;left:60px;right:60px;bottom:42px;text-align:center;font-family:var(--ff-mono);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(245,242,236,.92);z-index:7}

  /* ── 4:5 variant (1080×1350) ───────────────────────────── */
  .canvas.r45{height:1350px}
  .canvas.r45 .portrait{top:150px;height:540px}
  .canvas.r45 .hero{top:190px}
  .canvas.r45 .sub{top:490px}
  .canvas.r45 .ticket{bottom:170px}
  .canvas.r45 .pac{bottom:52px}

  /* ── 9:16 variant (1080×1920) ──────────────────────────── */
  .canvas.r916{height:1920px}
  .canvas.r916 .hero{top:170px;right:80px}
  .canvas.r916 .sub{top:450px;right:80px;font-size:30px}
  .canvas.r916 .star.s1{top:90px;left:auto;right:100px}
  .canvas.r916 .star.s2{top:190px;left:auto;right:210px}
  .canvas.r916 .star.s3{top:120px;left:auto;right:300px}
  .canvas.r916 .portrait{top:600px;right:auto;left:50%;transform:translateX(-50%);width:560px;height:700px}
  .canvas.r916 .wedge{clip-path:polygon(0 55%, 100% 32%, 100% 100%, 0 100%)}
  .canvas.r916 .ticket{bottom:220px}
  .canvas.r916 .pac{bottom:60px}

  /* consistency: emphasis is color-only — no red highlight bar, and inline
     emphasis inherits its container weight so each text block is one weight */
  em::before,em::after{display:none!important}
  em,b,strong{font-weight:inherit!important}
</style>
