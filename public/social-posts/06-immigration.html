<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>06 · Immigration</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0B2844; --red:#B62025; --red-3:#D63D42;
    --paper:#F5F2EC; --paper-2:#EDE8DD; --bone:#D4CCB7; --stone:#5F594D; --stone-d:#3E3A33;
    --ff:'Cabin',sans-serif; --ff-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#1a1a1a;display:grid;place-items:center;min-height:100vh;font-family:var(--ff)}
  .canvas{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--paper);color:var(--navy)}
  /* big diagonal navy wedge */
  .canvas::before{content:"";position:absolute;inset:0;background:var(--navy);clip-path:polygon(0 0,100% 0,100% 56%,0 38%);z-index:1}
  /* halftone on navy */
  .canvas::after{content:"";position:absolute;left:0;right:0;top:0;height:56%;background-image:radial-gradient(rgba(245,242,236,.06) 1.4px,transparent 1.6px);background-size:14px 14px;z-index:2}
  /* balance scale graphic upper-right */
  .scale{position:absolute;top:60px;right:60px;width:160px;height:160px;z-index:5}
  .scale svg{width:100%;height:100%;filter:drop-shadow(8px 8px 0 var(--red))}
  /* hero on navy */
  .hero{position:absolute;left:60px;right:60px;top:100px;color:var(--paper);z-index:4}
  .hero h1{font-family:var(--ff);font-weight:700;font-size:112px;line-height:.86;letter-spacing:-.035em;max-width:820px}
  .hero h1 em{font-style:normal;font-weight:400;color:var(--red-3)}
  /* huge arrow list — typography as design */
  .list{position:absolute;left:60px;right:60px;top:570px;z-index:4}
  .row{display:flex;align-items:baseline;gap:30px;padding:14px 0;border-top:3px solid var(--navy)}
  .row:last-child{border-bottom:3px solid var(--navy)}
  .row .arr{font-family:var(--ff);font-weight:700;color:var(--red);font-size:62px;line-height:1;width:80px;flex-shrink:0}
  .row .t{font-family:var(--ff);font-weight:700;font-size:60px;letter-spacing:-.025em;color:var(--navy);line-height:1}
  .row .t em{font-style:normal;font-weight:400;color:var(--red)}
  /* PAC */
  .pac{position:absolute;left:60px;right:60px;bottom:36px;font-family:var(--ff-mono);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);text-align:center;z-index:5}

  /* ── 4:5 variant (1080×1350) ───────────────────────────── */
  .canvas.r45{height:1350px}
  .canvas.r45::before{clip-path:polygon(0 0,100% 0,100% 50%,0 34%)}
  .canvas.r45::after{height:50%}
  .canvas.r45 .hero{top:130px}
  .canvas.r45 .list{top:740px}
  .canvas.r45 .row{padding:24px 0}
  .canvas.r45 .pac{bottom:44px}

  /* ── 9:16 variant (1080×1920) ──────────────────────────── */
  .canvas.r916{height:1920px}
  .canvas.r916::before{clip-path:polygon(0 0,100% 0,100% 40%,0 28%)}
  .canvas.r916::after{height:40%}
  .canvas.r916 .scale{top:80px;right:70px;width:190px;height:190px}
  .canvas.r916 .hero{top:200px}
  .canvas.r916 .list{top:920px}
  .canvas.r916 .row{padding:44px 0}
  .canvas.r916 .pac{bottom:60px}
</style>
</head>
<body>
  <div class="canvas">
    <div class="scale">
      <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- vertical pole -->
        <rect x="76" y="20" width="8" height="120" fill="#F5F2EC"/>
        <!-- crossbar -->
        <rect x="20" y="48" width="120" height="6" fill="#F5F2EC"/>
        <!-- base -->
        <rect x="50" y="138" width="60" height="8" fill="#F5F2EC"/>
        <!-- left pan -->
        <path d="M 20 56 L 50 90 L 10 90 Z" fill="#D63D42"/>
        <line x1="20" y1="54" x2="20" y2="56" stroke="#F5F2EC" stroke-width="3"/>
        <!-- right pan -->
        <path d="M 140 56 L 110 90 L 150 90 Z" fill="#D63D42"/>
        <!-- top knob -->
        <circle cx="80" cy="20" r="8" fill="#F5F2EC"/>
      </svg>
    </div>
    <div class="hero">
      <h1>Supporting a practical approach to <em>immigration.</em></h1>
    </div>
    <div class="list">
      <div class="row"><span class="arr">→</span><span class="t">Secure borders</span></div>
      <div class="row"><span class="arr">→</span><span class="t">Rule of law</span></div>
      <div class="row"><span class="arr">→</span><span class="t">Safe communities</span></div>
      <div class="row"><span class="arr">→</span><span class="t"><em>Honest leadership</em></span></div>
    </div>
    <div class="pac">Paid for by Friends of Mark Norman PAC #24927</div>
  </div>
  <script>
    const ratio = new URLSearchParams(location.search).get('ratio')
    if (ratio) document.querySelector('.canvas').classList.add('r' + ratio)
  </script>
<!-- post-scaler: fit canvas to viewport; ?v=45 / ?v=916 activate ratio variants -->
<style>
  html,body{height:100%;overflow:hidden}
  .canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1))}
</style>
<script>
(function(){
  var c=document.querySelector('.canvas')
  var v=new URLSearchParams(location.search).get('v')
  if(v==='45'||v==='916')c.classList.add('r'+v)
  var fit=function(){c.style.setProperty('--s',Math.min(innerWidth/c.offsetWidth,innerHeight/c.offsetHeight,1))}
  addEventListener('resize',fit)
  fit()
})()
</script>
</body>
</html>
