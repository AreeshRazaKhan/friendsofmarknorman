<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>20 · stripeField</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--navy:#0B2844;--navy-2:#102F4F;--navy-3:#0F3C66;--red:#B62025;--red-2:#921A1F;--red-3:#D63D42;--paper:#F5F2EC;--paper-2:#EDE8DD;--bone:#D4CCB7;--stone:#5F594D;--stone-d:#3E3A33;--paper-78:rgba(245,242,236,.82);--ff:'Cabin',sans-serif;--ff-mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:var(--ff)}
.logo{position:absolute;left:96px;top:150px;z-index:6}.logo-slot{display:inline-flex}
.eyebrow{display:flex;align-items:center;gap:18px;font-family:var(--ff-mono);font-size:24px;font-weight:600;letter-spacing:.26em;text-transform:uppercase}
.eyebrow::before{content:"";width:52px;height:5px;flex-shrink:0}
.headline{font-weight:700;letter-spacing:-.03em;line-height:.98}
.headline em{font-style:normal;font-weight:400;position:relative;display:inline-block}
.headline em::after{content:"";position:absolute;left:-7px;right:-7px;bottom:9px;height:18px;z-index:-1}
.stamp{position:absolute;z-index:4;background:var(--paper);border:6px solid var(--navy);border-radius:50%;display:grid;place-items:center;box-shadow:14px 14px 0 var(--red)}
.stamp svg{width:54%;height:54%}
.story{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:250px 96px}
.panel{position:relative;z-index:3;background:var(--navy);border-left:14px solid var(--red);padding:64px 64px;max-width:840px;box-shadow:0 28px 56px rgba(11,40,68,.24)}
.eyebrow{color:var(--red-3)}.eyebrow::before{background:var(--red-3)}
.headline{color:var(--paper);font-size:104px;margin-top:24px}.headline em{color:var(--red-3)}.headline em::after{background:rgba(182,32,37,.18)}
.body{color:var(--paper-78);font-size:36px;line-height:1.5;margin-top:32px;max-width:680px}
</style></head>
<body>
  <div class="story" data-fonts="Cabin,JetBrains Mono">
    <span aria-hidden="true" style="position:absolute;inset:0;z-index:0;background-image:repeating-linear-gradient(45deg,rgba(182,32,37,.7) 0 2px,transparent 2px 22px)"></span>
    <div class="logo"><div class="logo-slot"><img src="assets/mark-norman-logo-cabin-transparent.png" alt="Mark Norman for Oregon — House District 27" style="height:140px;width:auto;display:block" /></div></div>
    <div aria-hidden="true" style="position:absolute;z-index:4;color:var(--navy);border:4px solid var(--red);border-radius:10px;display:grid;place-items:center;transform:rotate(-8deg);right:120px;top:300px;width:200px;height:200px;z-index:5"><div style="width:60%;height:60%"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><path d="M50 14 C34 14 22 26 22 42 C22 64 50 88 50 88 C50 88 78 64 78 42 C78 26 66 14 50 14 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><circle cx="50" cy="42" r="11" fill="#B62025"/></svg></div></div>
    <div class="panel"><span class="eyebrow t">[ for oregon ]</span><h1 class="headline t">A fair chance for <em>every Oregon family</em></h1><p class="body t">Mark shares the goal of affordable healthcare, strong schools, and safe neighborhoods for every family.</p></div>
  </div>
<style>html,body{height:100%;overflow:hidden}.story{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1))}</style>
<script>(function(){var c=document.querySelector('.story');if(!c)return;var f=function(){c.style.setProperty('--s',Math.min(innerWidth/c.offsetWidth,innerHeight/c.offsetHeight,1))};addEventListener('resize',f);f()})()</script>
</body></html>
