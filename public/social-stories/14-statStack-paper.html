<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>14 · statStack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--navy:#0B2844;--navy-2:#102F4F;--navy-3:#0F3C66;--red:#B62025;--red-2:#921A1F;--red-3:#D63D42;--paper:#F5F2EC;--paper-2:#EDE8DD;--bone:#D4CCB7;--stone:#5F594D;--stone-d:#3E3A33;--paper-78:rgba(245,242,236,.82);--ff:'Cabin',sans-serif;--ff-mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:var(--ff)}
.logo{position:absolute;left:96px;top:150px;z-index:6}.logo-slot{display:inline-flex}
.eyebrow{display:flex;align-items:center;gap:18px;font-family:var(--ff-mono);font-size:24px;font-weight:600;letter-spacing:.26em;text-transform:uppercase}
.eyebrow::before{content:"";width:52px;height:5px;flex-shrink:0}
.headline{font-weight:700;letter-spacing:-.03em;line-height:.98}
.headline em{font-style:normal;font-weight:400;position:relative;display:inline-block}
.headline em::after{content:"";position:absolute;left:-7px;right:-7px;bottom:9px;height:18px;z-index:-1}
.stamp{position:absolute;z-index:4;background:var(--paper);border:6px solid var(--navy);border-radius:50%;display:grid;place-items:center;box-shadow:14px 14px 0 var(--red)}
.stamp svg{width:54%;height:54%}
.story{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--paper);color:var(--navy)}
.eyebrow{color:var(--red)}.eyebrow::before{background:var(--red)}
.headline{color:var(--navy)}.headline em{color:var(--red)}.headline em::after{background:rgba(182,32,37,.20)}
.body{font-size:36px;line-height:1.5;color:var(--stone-d)}
.story{display:flex;flex-direction:column;justify-content:center;padding:250px 96px}
.content{position:relative;z-index:3;max-width:820px}
.headline{font-size:84px;margin-top:22px}
.stats{display:flex;flex-direction:column;gap:30px;margin-top:54px}
.body{margin-top:46px;max-width:740px}
.st{display:flex;align-items:baseline;gap:26px}.num{font-weight:700;font-size:128px;line-height:.82;letter-spacing:-.03em;color:var(--navy)}.num .plus{color:var(--red);font-size:68px;vertical-align:super}.desc{font-family:var(--ff-mono);font-size:20px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--stone-d)}
/* emphasis is red color only — no highlight bar under/after the word */
.headline em::after,.title em::after,.quote em::after{display:none}
</style></head>
<body>
  <div class="story" data-fonts="Cabin,JetBrains Mono">
    <span aria-hidden="true" style="position:absolute;inset:0;z-index:0;background-image:radial-gradient(rgba(11,40,68,.05) 1.4px,transparent 1.7px);background-size:15px 15px"></span><span aria-hidden="true" style="position:absolute;z-index:0;color:var(--red);font-weight:700;top:320px;right:170px;font-size:44px">★</span>
    <div class="logo"><div class="logo-slot"><img src="assets/mark-norman-logo-cabin-transparent.png" alt="Mark Norman for Oregon — House District 27" style="height:140px;width:auto;display:block" /></div></div>
    <div aria-hidden="true" style="position:absolute;z-index:4;background:var(--navy);color:var(--paper);border-radius:20px;display:grid;place-items:center;box-shadow:10px 10px 0 var(--red);right:120px;top:300px;width:230px;height:230px"><div style="width:52%;height:52%"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><line x1="30" y1="16" x2="30" y2="86" stroke="currentColor" stroke-width="6"/><path d="M30 20 H72 L62 34 L72 48 H30 Z" fill="#B62025" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg></div></div>
    <div class="content"><span class="eyebrow t">[ a different path ]</span><h1 class="headline t">House District 27 <em>deserves better.</em></h1><p class="body t">Less bureaucracy. More accountability. Safer communities. Stronger schools. Lower pressure on families. Practical leadership.</p></div>
  </div>
<style>html,body{height:100%;overflow:hidden}.story{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1))}</style>
<script>(function(){var c=document.querySelector('.story');if(!c)return;var f=function(){c.style.setProperty('--s',Math.min(innerWidth/c.offsetWidth,innerHeight/c.offsetHeight,1))};addEventListener('resize',f);f()})()</script>
</body></html>
